# Local development / laptop run.
#   docker compose up
# Prod (Cloudflare): ./deploy-live.sh → compose.live.yml

services:
  onlyshrooms:
    image: ${ONLYSHROOMS_IMAGE:-onlyshrooms}
    container_name: onlyshrooms
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - onlyshrooms-data:/data
volumes:
  onlyshrooms-data:
    name: onlyshrooms-data
