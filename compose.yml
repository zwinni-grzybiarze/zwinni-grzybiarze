services:
  onlyshrooms:
    depends_on:
      keycloak:
        condition: service_healthy
    image: onlyshrooms
    container_name: onlyshrooms
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      Authentication__Keycloak__Issuer: "http://localhost:8081/realms/onlyshrooms"
      Authentication__Keycloak__MetadataAddress: "http://keycloak:8080/realms/onlyshrooms/.well-known/openid-configuration"
      Authentication__Keycloak__Audience: "onlyshrooms-api"
    ports:
      - "8080:8080"
    volumes:
      - onlyshrooms-data:/data
  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.8
    command: ["start-dev","--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET}
    ports:
      - "8081:8080"
    volumes:
        - keycloak-data:/opt/keycloak/data
        - ./keycloak/realm-import:/opt/keycloak/data/import
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1.1 200 OK' <&3
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    
volumes:
  onlyshrooms-data:
    name: onlyshrooms-data
  keycloak-data:
    name: keycloak-data
