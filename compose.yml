services:
  onlyshrooms:
    depends_on:
      keycloak:
        condition: service_healthy
    image: onlyshrooms
    container_name: onlyshrooms
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - onlyshrooms-data:/data
  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.8
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/ready"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
    
volumes:
  onlyshrooms-data:
    name: onlyshrooms-data
