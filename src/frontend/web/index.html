<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OnlyShrooms — manage grzybobrania with your crew">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OnlyShrooms">
  <meta name="theme-color" content="#2D6A4F">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/Icon-512.png"/>

  <title>OnlyShrooms</title>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <!-- Drop any old Flutter PWA service worker / Cache Storage from earlier deploys. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
